[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elimu-common"
version = "0.1.0"
description = "Shared utilities for ElimuAI Python microservices"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "python-jose[cryptography]>=3.3",
  "bcrypt>=4.2",
  "redis>=5.0",
  "httpx>=0.27",
  "structlog>=24.1",
]

[tool.setuptools.packages.find]
where = ["src"]
