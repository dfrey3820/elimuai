worker_processes 1;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # ─── Log format ─────────────────────────────────────────────────────────
    log_format json escape=json
      '{"time":"$time_iso8601","method":"$request_method","uri":"$request_uri",'
      '"status":$status,"upstream":"$upstream_addr","rt":$request_time,'
      '"user":"$http_x_user_id","ip":"$remote_addr"}';
    access_log /var/log/nginx/access.log json;

    # ─── Upstreams (one per Python service) ─────────────────────────────────
    upstream auth_service      { server auth-service:5100; }
    upstream users_service     { server users-service:5101; }
    upstream schools_service   { server schools-service:5102; }
    upstream billing_service   { server billing-service:5103; }
    upstream learning_service  { server learning-service:5104; }
    upstream admin_service     { server admin-service:5105; }

    # ─── Rate limits ────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth_ip:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_ip:10m  rate=60r/s;

    server {
        listen 8091;
        server_name _;

        client_max_body_size 30m;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # ─── Internal JWT verification via auth-service ─────────────────────
        # nginx calls auth-service /internal/verify with the Authorization
        # header. auth-service returns 200 + X-User-Id/X-User-Role headers,
        # or 401. Those headers are then forwarded to downstream services.
        location = /_verify {
            internal;
            proxy_pass http://auth_service/internal/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
        }

        # Extract headers from the auth_request subrequest response
        auth_request_set $auth_user_id   $upstream_http_x_user_id;
        auth_request_set $auth_user_role $upstream_http_x_user_role;

        # ─── Public routes (no auth) ────────────────────────────────────────
        location = /health {
            return 200 '{"status":"ok","service":"gateway"}';
            add_header Content-Type application/json;
        }

        # Auth endpoints don't go through auth_request (they issue the tokens)
        location /api/auth/ {
            limit_req zone=auth_ip burst=20 nodelay;
            # Explicitly block the internal verify endpoint from public
            location = /api/auth/internal/verify { return 404; }
            proxy_pass http://auth_service;
        }

        # ─── Authenticated routes ───────────────────────────────────────────
        # Each block validates JWT via auth_request, then forwards user headers.

        location /api/users/ {
            auth_request /_verify;
            proxy_set_header X-User-Id   $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            limit_req zone=api_ip burst=100 nodelay;
            proxy_pass http://users_service;
        }

        location /api/children {
            auth_request /_verify;
            proxy_set_header X-User-Id   $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            limit_req zone=api_ip burst=100 nodelay;
            proxy_pass http://users_service;
        }

        location /api/schools/ {
            auth_request /_verify;
            proxy_set_header X-User-Id   $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_pass http://schools_service;
        }

        location /api/onboarding/ {
            auth_request /_verify;
            proxy_set_header X-User-Id   $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_pass http://schools_service;
        }

        # Public inbound webhook for external payment gateways.
        # `^~` ensures this longest-prefix match wins over the authenticated
        # /api/payments/ block below, so callers do NOT need a JWT — the
        # billing-service verifies an HMAC signature on the raw body instead.
        location ^~ /api/payments/webhook/ {
            proxy_pass http://billing_service;
        }

        location /api/payments/ {
            auth_request /_verify;
            proxy_set_header X-User-Id   $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_pass http://billing_service;
        }

        location /api/coupons/ {
            auth_request /_verify;
            proxy_set_header X-User-Id   $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_pass http://billing_service;
        }

        location /api/ai/ {
            auth_request /_verify;
            proxy_set_header X-User-Id   $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_pass http://learning_service;

            # Photo Scan streams SSE. Disable buffering and extend timeouts
            # so tokens reach the browser as they are generated.
            location /api/ai/photoscan/ {
                auth_request /_verify;
                proxy_set_header X-User-Id   $auth_user_id;
                proxy_set_header X-User-Role $auth_user_role;
                proxy_pass http://learning_service;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_buffering off;
                proxy_cache off;
                proxy_read_timeout 120s;
                chunked_transfer_encoding on;
            }
        }

        location /api/progress/ {
            auth_request /_verify;
            proxy_set_header X-User-Id   $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_pass http://learning_service;
        }

        # Leaderboard: accept both /api/leaderboard and /api/leaderboard/*
        location /api/leaderboard {
            auth_request /_verify;
            proxy_set_header X-User-Id   $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_pass http://learning_service;
        }

        location /api/exams/ {
            auth_request /_verify;
            proxy_set_header X-User-Id   $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_pass http://learning_service;
        }

        # Curriculum: offline-lessons is public, subjects requires auth. Keep both here;
        # auth_request is skipped for the public endpoint by using a nested exact match.
        location /api/curriculum/ {
            auth_request /_verify;
            proxy_set_header X-User-Id   $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_pass http://learning_service;
        }
        location = /api/curriculum/offline-lessons {
            proxy_pass http://learning_service;
        }

        location /api/admin/ {
            auth_request /_verify;
            proxy_set_header X-User-Id   $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_pass http://admin_service;
        }

        # CH6 Insurance Agent Network — webhook endpoint (called by billing service
        # on recurring payment confirmation). Authenticated so only internal callers
        # with a valid JWT can process conversions.
        location /api/ch6/ {
            auth_request /_verify;
            proxy_set_header X-User-Id   $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_pass http://admin_service;
        }

        # 401 handler when auth_request fails
        error_page 401 = @unauthorized;
        location @unauthorized {
            add_header Content-Type application/json always;
            return 401 '{"error":"Unauthorized"}';
        }
    }
}
