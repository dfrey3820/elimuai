[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "uvicorn[standard]>=0.30",
  "elimu-common",
  "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "aiosqlite>=0.20",  # unit-test DB
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
