AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ElimuAI Python microservices on ECS Fargate.
  Single Fargate task, 9 containers (postgres, redis, 6 API services, notifications worker, gateway).
  Shared env via S3 env file. HTTPS ALB using ACM cert. Data on EFS.

Parameters:
  ProjectName:
    Type: String
    Default: elimuai
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnets:
    Type: List<AWS::EC2::Subnet::Id>
  CertificateArn:
    Type: String
  ImageTag:
    Type: String
    Default: latest
  EcrAccount:
    Type: String
    Default: '977233000130'
  AwsRegion:
    Type: String
    Default: eu-west-1
  ConfigBucketName:
    Type: String
    Description: S3 bucket that holds the prod.env file
  EnvFileKey:
    Type: String
    Default: env/prod.env
  UploadsBucketName:
    Type: String
    Description: S3 bucket for user uploads (papers, avatars, etc.)
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 2
  TaskCpu:
    Type: String
    Default: '1024'
    AllowedValues: ['1024', '2048', '4096', '8192']
  TaskMemory:
    Type: String
    Default: '3072'
    AllowedValues: ['2048', '3072', '4096', '5120', '6144', '7168', '8192', '16384']
  SpotWeight:
    Type: Number
    Default: 4
  OnDemandWeight:
    Type: Number
    Default: 1

Resources:
  # ─── Security groups ─────────────────────────────────────────────────────

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${ProjectName} ALB SG'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80,  ToPort: 80,  CidrIp: 0.0.0.0/0, Description: HTTP redirect}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS}

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${ProjectName} ECS task SG'
      VpcId: !Ref VpcId

  ServiceIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ServiceSecurityGroup
      IpProtocol: tcp
      FromPort: 8091
      ToPort: 8091
      SourceSecurityGroupId: !Ref AlbSecurityGroup

  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${ProjectName} EFS SG'
      VpcId: !Ref VpcId

  EfsIngressFromService:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EfsSecurityGroup
      IpProtocol: tcp
      FromPort: 2049
      ToPort: 2049
      SourceSecurityGroupId: !Ref ServiceSecurityGroup

  # ─── EFS filesystem for postgres + redis persistence ─────────────────────

  EfsFileSystem:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: bursting
      FileSystemTags:
        - {Key: Name, Value: !Sub '${ProjectName}-data'}

  EfsMountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EfsFileSystem
      SubnetId: !Select [0, !Ref PublicSubnets]
      SecurityGroups: [!Ref EfsSecurityGroup]

  EfsMountTargetB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EfsFileSystem
      SubnetId: !Select [1, !Ref PublicSubnets]
      SecurityGroups: [!Ref EfsSecurityGroup]

  EfsMountTargetC:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EfsFileSystem
      SubnetId: !Select [2, !Ref PublicSubnets]
      SecurityGroups: [!Ref EfsSecurityGroup]

  EfsAccessPointPostgres:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref EfsFileSystem
      PosixUser: {Uid: '999', Gid: '999'}
      RootDirectory:
        Path: /postgres
        CreationInfo: {OwnerUid: '999', OwnerGid: '999', Permissions: '0700'}

  EfsAccessPointRedis:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref EfsFileSystem
      PosixUser: {Uid: '999', Gid: '1000'}
      RootDirectory:
        Path: /redis
        CreationInfo: {OwnerUid: '999', OwnerGid: '1000', Permissions: '0770'}

  # ─── ALB ─────────────────────────────────────────────────────────────────

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${ProjectName}-alb'
      Type: application
      Scheme: internet-facing
      Subnets: !Ref PublicSubnets
      SecurityGroups: [!Ref AlbSecurityGroup]

  GatewayTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-gw-tg'
      VpcId: !Ref VpcId
      Port: 8091
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: {HttpCode: '200-399'}
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '30'}

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: {Protocol: HTTPS, Port: '443', StatusCode: HTTP_301}

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: !Ref CertificateArn}]
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref GatewayTargetGroup

  # ─── IAM ─────────────────────────────────────────────────────────────────

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-ecs-exec-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: sts:AssumeRole}
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadConfigBucket
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetBucketLocation]
                Resource:
                  - !Sub 'arn:aws:s3:::${ConfigBucketName}'
                  - !Sub 'arn:aws:s3:::${ConfigBucketName}/*'

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-ecs-task-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: sts:AssumeRole}
      Policies:
        - PolicyName: UploadsBucketRW
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject, s3:ListBucket]
                Resource:
                  - !Sub 'arn:aws:s3:::${UploadsBucketName}'
                  - !Sub 'arn:aws:s3:::${UploadsBucketName}/*'
        - PolicyName: EcsExecOverSsm
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: '*'

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}'
      RetentionInDays: 14

  # ─── ECS ─────────────────────────────────────────────────────────────────

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${ProjectName}-cluster'
      CapacityProviders: [FARGATE, FARGATE_SPOT]

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-stack'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      Volumes:
        - Name: postgres-data
          EFSVolumeConfiguration:
            FilesystemId: !Ref EfsFileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig: {AccessPointId: !Ref EfsAccessPointPostgres, IAM: DISABLED}
        - Name: redis-data
          EFSVolumeConfiguration:
            FilesystemId: !Ref EfsFileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig: {AccessPointId: !Ref EfsAccessPointRedis, IAM: DISABLED}
      ContainerDefinitions:
        # ─── postgres ────────────────────────────────────────────────────
        - Name: postgres
          Image: public.ecr.aws/docker/library/postgres:15-alpine
          Essential: true
          User: '999:999'
          EnvironmentFiles:
            - {Value: !Sub 'arn:aws:s3:::${ConfigBucketName}/${EnvFileKey}', Type: s3}
          Environment:
            - {Name: PGDATA, Value: /var/lib/postgresql/data/pgdata}
          PortMappings: [{ContainerPort: 5432, Protocol: tcp}]
          MountPoints:
            - {SourceVolume: postgres-data, ContainerPath: /var/lib/postgresql/data}
          HealthCheck:
            Command: [CMD-SHELL, "pg_isready -U elimuai_user -d elimuai_db -h 127.0.0.1 || exit 1"]
            Interval: 15
            Timeout: 5
            Retries: 10
            StartPeriod: 90
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: postgres

        # ─── redis ───────────────────────────────────────────────────────
        - Name: redis
          Image: public.ecr.aws/docker/library/redis:7-alpine
          Essential: true
          Command: [redis-server, --appendonly, 'yes', --dir, /data]
          PortMappings: [{ContainerPort: 6379, Protocol: tcp}]
          MountPoints:
            - {SourceVolume: redis-data, ContainerPath: /data}
          HealthCheck:
            Command: [CMD-SHELL, "redis-cli ping | grep -q PONG"]
            Interval: 15
            Timeout: 3
            Retries: 5
            StartPeriod: 20
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: redis

        # ─── Python services ─────────────────────────────────────────────
        - Name: auth-service
          Image: !Sub '${EcrAccount}.dkr.ecr.${AwsRegion}.amazonaws.com/${ProjectName}/auth-service:${ImageTag}'
          Essential: true
          DependsOn:
            - {ContainerName: postgres, Condition: HEALTHY}
            - {ContainerName: redis,    Condition: HEALTHY}
          EnvironmentFiles:
            - {Value: !Sub 'arn:aws:s3:::${ConfigBucketName}/${EnvFileKey}', Type: s3}
          Environment:
            - {Name: SERVICE_NAME, Value: auth-service}
            - {Name: PORT,         Value: '5100'}
          PortMappings: [{ContainerPort: 5100, Protocol: tcp}]
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref LogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: auth}

        - Name: users-service
          Image: !Sub '${EcrAccount}.dkr.ecr.${AwsRegion}.amazonaws.com/${ProjectName}/users-service:${ImageTag}'
          Essential: true
          DependsOn:
            - {ContainerName: postgres, Condition: HEALTHY}
            - {ContainerName: redis,    Condition: HEALTHY}
          EnvironmentFiles:
            - {Value: !Sub 'arn:aws:s3:::${ConfigBucketName}/${EnvFileKey}', Type: s3}
          Environment:
            - {Name: SERVICE_NAME, Value: users-service}
            - {Name: PORT,         Value: '5101'}
          PortMappings: [{ContainerPort: 5101, Protocol: tcp}]
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref LogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: users}

        - Name: schools-service
          Image: !Sub '${EcrAccount}.dkr.ecr.${AwsRegion}.amazonaws.com/${ProjectName}/schools-service:${ImageTag}'
          Essential: true
          DependsOn:
            - {ContainerName: postgres, Condition: HEALTHY}
            - {ContainerName: redis,    Condition: HEALTHY}
          EnvironmentFiles:
            - {Value: !Sub 'arn:aws:s3:::${ConfigBucketName}/${EnvFileKey}', Type: s3}
          Environment:
            - {Name: SERVICE_NAME, Value: schools-service}
            - {Name: PORT,         Value: '5102'}
          PortMappings: [{ContainerPort: 5102, Protocol: tcp}]
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref LogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: schools}

        - Name: billing-service
          Image: !Sub '${EcrAccount}.dkr.ecr.${AwsRegion}.amazonaws.com/${ProjectName}/billing-service:${ImageTag}'
          Essential: true
          DependsOn:
            - {ContainerName: postgres, Condition: HEALTHY}
            - {ContainerName: redis,    Condition: HEALTHY}
          EnvironmentFiles:
            - {Value: !Sub 'arn:aws:s3:::${ConfigBucketName}/${EnvFileKey}', Type: s3}
          Environment:
            - {Name: SERVICE_NAME, Value: billing-service}
            - {Name: PORT,         Value: '5103'}
          PortMappings: [{ContainerPort: 5103, Protocol: tcp}]
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref LogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: billing}

        - Name: learning-service
          Image: !Sub '${EcrAccount}.dkr.ecr.${AwsRegion}.amazonaws.com/${ProjectName}/learning-service:${ImageTag}'
          Essential: true
          DependsOn:
            - {ContainerName: postgres, Condition: HEALTHY}
            - {ContainerName: redis,    Condition: HEALTHY}
          EnvironmentFiles:
            - {Value: !Sub 'arn:aws:s3:::${ConfigBucketName}/${EnvFileKey}', Type: s3}
          Environment:
            - {Name: SERVICE_NAME, Value: learning-service}
            - {Name: PORT,         Value: '5104'}
          PortMappings: [{ContainerPort: 5104, Protocol: tcp}]
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref LogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: learning}

        - Name: admin-service
          Image: !Sub '${EcrAccount}.dkr.ecr.${AwsRegion}.amazonaws.com/${ProjectName}/admin-service:${ImageTag}'
          Essential: true
          DependsOn:
            - {ContainerName: postgres, Condition: HEALTHY}
            - {ContainerName: redis,    Condition: HEALTHY}
          EnvironmentFiles:
            - {Value: !Sub 'arn:aws:s3:::${ConfigBucketName}/${EnvFileKey}', Type: s3}
          Environment:
            - {Name: SERVICE_NAME, Value: admin-service}
            - {Name: PORT,         Value: '5105'}
          PortMappings: [{ContainerPort: 5105, Protocol: tcp}]
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref LogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: admin}

        - Name: notifications-service
          Image: !Sub '${EcrAccount}.dkr.ecr.${AwsRegion}.amazonaws.com/${ProjectName}/notifications-service:${ImageTag}'
          Essential: true
          DependsOn:
            - {ContainerName: postgres, Condition: HEALTHY}
            - {ContainerName: redis,    Condition: HEALTHY}
          EnvironmentFiles:
            - {Value: !Sub 'arn:aws:s3:::${ConfigBucketName}/${EnvFileKey}', Type: s3}
          Environment:
            - {Name: SERVICE_NAME, Value: notifications-service}
          Command: [python, -m, app.worker]
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref LogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: notifications}

        # ─── gateway (nginx + static frontend) ────────────────────────────
        # Serves the Next.js static export from /usr/share/nginx/html plus
        # reverse-proxies /api/* to the Python microservices on 127.0.0.1.
        - Name: gateway
          Image: !Sub '${EcrAccount}.dkr.ecr.${AwsRegion}.amazonaws.com/${ProjectName}/gateway:${ImageTag}'
          Essential: true
          DependsOn:
            - {ContainerName: auth-service,     Condition: START}
            - {ContainerName: users-service,    Condition: START}
            - {ContainerName: schools-service,  Condition: START}
            - {ContainerName: billing-service,  Condition: START}
            - {ContainerName: learning-service, Condition: START}
            - {ContainerName: admin-service,    Condition: START}
          PortMappings: [{ContainerPort: 8091, Protocol: tcp}]
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref LogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: gateway}

  Service:
    Type: AWS::ECS::Service
    DependsOn: [HttpsListener, EfsMountTargetA, EfsMountTargetB, EfsMountTargetC]
    Properties:
      ServiceName: !Sub '${ProjectName}-svc'
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      EnableExecuteCommand: true
      # EFS-backed postgres → force one instance at a time to avoid double-mount corruption
      DeploymentConfiguration: {MinimumHealthyPercent: 0, MaximumPercent: 100}
      CapacityProviderStrategy:
        - {CapacityProvider: FARGATE_SPOT, Weight: !Ref SpotWeight}
        - {CapacityProvider: FARGATE,      Weight: !Ref OnDemandWeight}
      PlatformVersion: '1.4.0'
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref PublicSubnets
          SecurityGroups: [!Ref ServiceSecurityGroup]
      LoadBalancers:
        - {ContainerName: gateway, ContainerPort: 8091, TargetGroupArn: !Ref GatewayTargetGroup}

Outputs:
  ClusterName:
    Value: !Ref Cluster
    Export: {Name: !Sub '${AWS::StackName}-ClusterName'}
  ServiceName:
    Value: !GetAtt Service.Name
    Export: {Name: !Sub '${AWS::StackName}-ServiceName'}
  TaskDefArn:
    Value: !Ref TaskDefinition
  AlbDnsName:
    Value: !GetAtt Alb.DNSName
  AlbHostedZoneId:
    Value: !GetAtt Alb.CanonicalHostedZoneID
  EfsFileSystemId:
    Value: !Ref EfsFileSystem
