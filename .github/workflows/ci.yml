name: CI

on:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - users-service
          - schools-service
          - billing-service
          - learning-service
          - admin-service
          - notifications-service
    env:
      # Dummy values — unit tests never reach a real DB.
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-only-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install service + dev deps
        working-directory: backend-py
        run: |
          pip install -e libs/elimu_common
          pip install -e "services/${{ matrix.service }}[dev]"
      - name: Run tests
        working-directory: backend-py/services/${{ matrix.service }}
        # auth-service: 3 known-failing tests need a live DB lifespan / have an
        # expired JWT fixture — deselected until fixed.
        run: |
          if [ "${{ matrix.service }}" = "auth-service" ]; then
            python -m pytest tests/ -q \
              --deselect tests/test_auth_flow.py::test_register_login_flow \
              --deselect tests/test_auth_flow.py::test_admin_signup_requires_school_name \
              --deselect tests/test_security.py::test_generate_tokens_shape
          else
            python -m pytest tests/ -q
          fi

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build --workspace=frontend
