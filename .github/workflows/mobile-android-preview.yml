name: Android Mobile Preview

on:
  push:
    branches:
      - 'mobile/samsung-preview-*'
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze app
        run: flutter analyze
      - name: Run mobile tests
        run: flutter test
      - name: Build Samsung preview APK
        run: flutter build apk --debug --target-platform android-arm64 --dart-define=API_BASE_URL=https://api.elimuai.africa
      - name: Checksum APK
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-debug.apk > app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: elimuai-samsung-debug
          path: |
            mobile/build/app/outputs/flutter-apk/app-debug.apk
            mobile/build/app/outputs/flutter-apk/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7